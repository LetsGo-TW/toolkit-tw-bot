<section class="go-command-mode">
  <div class="go-mode" role="radiogroup" aria-label="Modo de execução">
    <button
      id="go:mode:send"
      class="go-mode-btn is-selected"
      data-command-mode="send"
      aria-pressed="true"
      type="button"
    >
      <img data-mode-icon="send" alt="" aria-hidden="true">
      Enviar
    </button>
    <button
      id="go:mode:schedule"
      class="go-mode-btn"
      data-command-mode="schedule"
      aria-pressed="false"
      type="button"
    >
      <img data-mode-icon="schedule" alt="" aria-hidden="true">
      Agendar
    </button>
  </div>
</section>
