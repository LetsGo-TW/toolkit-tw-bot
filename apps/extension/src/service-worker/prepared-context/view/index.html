<section
  id="go-extension-bot-view"
  data-go-bot-view="1"
  data-go-bot-view-state="running"
>
  <div data-go-bot-view-rail="1">
    <button
      type="button"
      data-go-bot-view-trigger="1"
      data-go-bot-view-tooltip-disabled="1"
      aria-label="Let's GO!"
    >
      <span data-go-bot-view-brand="1">
        <img
          src="__BOT_VIEW_ICON_URL__"
          alt="Let's GO!"
          width="24"
          height="24"
        />
      </span>
    </button>
    <div data-go-bot-view-slots="1">
      <div id="go-extension-bot-view-slot-config" data-go-bot-view-slot="config"></div>
      <div id="go-extension-bot-view-slot-collector" data-go-bot-view-slot="collector"></div>
      <div id="go-extension-bot-view-slot-planner" data-go-bot-view-slot="planner"></div>
      <div id="go-extension-bot-view-slot-draft" data-go-bot-view-slot="draft"></div>
    </div>
  </div>
  <div data-go-bot-view-status="1">
    <img
      src="__BOT_VIEW_ICON_URL__"
      alt=""
      aria-hidden="true"
      data-go-bot-view-status-icon="1"
      width="12"
      height="12"
    />

    <span
      id="go-extension-bot-view-status-script"
      data-go-bot-view-status-part="script"
    >
      Call-Balancer
    </span>
    <span
      id="go-extension-bot-view-status-execution"
      data-go-bot-view-status-part="execution"
    >
      Distribuindo recursos
    </span>
    <span
      id="go-extension-bot-view-status-next"
      data-go-bot-view-status-part="next"
    >
      Próx. em 00:42
    </span>
  </div>
  <div data-go-bot-view-tooltip-popup="1" hidden></div>
</section>
